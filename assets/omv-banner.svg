<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="OpenMediaVault Integration for Home Assistant">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FB8"/>
      <stop offset="100%" stop-color="#0A2E52"/>
    </linearGradient>
    <pattern id="stripes" width="42" height="42" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="42" height="42" fill="transparent"/>
      <rect width="10" height="42" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#stripes)"/>

  <text x="60" y="178" font-family="Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">OpenMediaVault</text>
  <text x="64" y="216" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#ffffff" opacity="0.92">für Home Assistant</text>
  <text x="64" y="256" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" opacity="0.8">Dateisystem &#183; System &#183; Festplatten &#183; Dienste</text>

  <rect x="60" y="284" width="460" height="2" fill="#ffffff" opacity="0.25"/>

  <!-- disk / hard drive -->
  <g transform="translate(920,110)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" opacity="0.10"/>
    <rect x="-32" y="-22" width="64" height="44" rx="6" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.92"/>
    <circle cx="-16" cy="10" r="5" fill="#ffffff" opacity="0.85"/>
    <circle cx="2" cy="10" r="5" fill="#ffffff" opacity="0.85"/>
    <line x1="-32" y1="-4" x2="32" y2="-4" stroke="#ffffff" stroke-width="4" opacity="0.75"/>
  </g>

  <!-- server rack -->
  <g transform="translate(1050,110)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" opacity="0.10"/>
    <rect x="-26" y="-30" width="52" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.92"/>
    <rect x="-26" y="-8" width="52" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.92"/>
    <rect x="-26" y="14" width="52" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.92"/>
    <circle cx="16" cy="-21" r="3" fill="#ffffff" opacity="0.85"/>
    <circle cx="16" cy="1" r="3" fill="#ffffff" opacity="0.85"/>
    <circle cx="16" cy="23" r="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- health / monitoring shield -->
  <g transform="translate(985,255)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" opacity="0.10"/>
    <path d="M0,-32 L28,-20 V6 C28,26 14,38 0,44 C-14,38 -28,26 -28,6 V-20 Z" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.92"/>
    <path d="M-12,2 L-3,12 L14,-10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  </g>
</svg>
